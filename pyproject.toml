[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "bctui"
description = "A simple text-based Bandcamp music player"
dynamic = ["version"]
dependencies = [
    "textual>=8.2.7",
    "httpx>=0.28.1",
    "pyxdg>=0.28",
    "mpv>=1.0.8",
]
requires-python = ">=3.10"
authors = [
    {name = "Simon J. Larsen", email = "simonhffh@gmail.com"},
]
maintainers = [
    {name = "Simon J. Larsen", email = "simonhffh@gmail.com"},
]
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
license-files = ["LICENSE"]
keywords = ["bandcamp", "music", "subsonic"]

[project.urls]
Homepage = "https://github.com/SimonLarsen/bctui"
Repository = "https://github.com/SimonLarsen/bctui"
"Bug Tracker" = "https://github.com/SimonLarsen/bctui/issues"

[project.scripts]
bctui = "bctui.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "bctui.__version__"}

[tool.setuptools.package-data]
bctui = ["*.tcss"]

[tool.basedpyright]
typeCheckingMode = "standard"

[tool.ruff]
line-length = 88
indent-width = 4

[too.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[dependency-groups]
dev = [
    "textual-dev>=1.8.0",
]
